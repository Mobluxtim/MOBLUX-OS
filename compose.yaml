services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Run pnpm setup}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Run pnpm setup}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["object-data:/data"]
volumes:
  postgres-data:
  object-data:
